<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img"><title>Valid returns and worst error</title><desc>Three of three textured samples return depth; only one of three glossy samples does.</desc><g font-family="DejaVu Sans,sans-serif"><rect x="0" y="0" width="840" height="500" rx="22" fill="#eff7f7"/><text x="44" y="63" font-size="41" font-weight="700" fill="#102f3c" text-anchor="start">Keep the missing samples</text>
<text x="44" y="110" font-size="28" font-weight="400" fill="#365867" text-anchor="start">Synthetic CSV audit at 1 to 2 m</text>
<text x="44" y="174" font-size="36" font-weight="700" fill="#102f3c" text-anchor="start">Textured</text>
<rect x="44" y="194" width="96" height="33" rx="8" fill="#117777"/>
