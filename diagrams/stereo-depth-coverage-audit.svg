<text x="416" y="394" font-size="33" font-weight="700" fill="#a6492a" text-anchor="start">1/3 valid</text>
<text x="44" y="450" font-size="30" font-weight="400" fill="#365867" text-anchor="start">Worst valid error: 400 mm</text></g></svg>
